name: Deploy Archive Site to Server

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Transfer files via SSH
        run: |
          sudo apt-get install -y sshpass

          # 1) 코드: 매번 덮어쓰는 파일 (공개 페이지 + 공통 이미지)
          mkdir -p pack/site/assets pack/seed pack/cms
          cp index.html pack/site/
          cp -r assets/ui assets/swmc-logo.png pack/site/assets/ 2>/dev/null || true

          # 2) 시드: CMS가 관리하는 데이터. 서버에 이미 있으면 건드리지 않음 (최초 1회만 채움)
          cp data.js pack/seed/
          mkdir -p pack/seed/assets
          cp -r assets/posters assets/catalogs pack/seed/assets/ 2>/dev/null || true

          # 3) CMS 코드 (data/, node_modules/, tmp/ 는 제외)
          cp -r cms/server.js cms/public cms/package.json cms/package-lock.json pack/cms/

          tar -czf site.tar.gz -C pack/site .
          tar -czf seed.tar.gz -C pack/seed .
          tar -czf cms.tar.gz -C pack/cms .

          for f in site seed cms; do
            cat $f.tar.gz | sshpass -p "${{ secrets.PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.USERNAME }}@${{ secrets.SERVER_HOST }} "cat > /tmp/archive_$f.tar.gz"
          done

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 10m
          script: |
            SITE_DIR="/var/www/html/archive"
            CMS_DIR="/var/www/archive-cms"   # 웹 루트 밖: cms/data 가 외부에 노출되지 않음
            PW="${{ secrets.PASSWORD }}"

            echo "$PW" | sudo -S mkdir -p $SITE_DIR $CMS_DIR
            # CMS가 data.js, assets 를 쓸 수 있도록 소유자를 배포 계정으로 맞춤 (nginx는 읽기만 하면 됨)
            echo "$PW" | sudo -S chown -R "$(id -un):$(id -gn)" $SITE_DIR $CMS_DIR

            # 코드는 덮어쓰기
            tar -xzf /tmp/archive_site.tar.gz -C $SITE_DIR

            # 데이터는 이미 있는 파일은 유지 (CMS에서 올린 내용 보호)
            tar -xzf /tmp/archive_seed.tar.gz -C $SITE_DIR --skip-old-files

            # CMS 코드 갱신
            tar -xzf /tmp/archive_cms.tar.gz -C $CMS_DIR
            rm -f /tmp/archive_site.tar.gz /tmp/archive_seed.tar.gz /tmp/archive_cms.tar.gz

            # CMS 실행 (서버에 Node가 있을 때만)
            if command -v node >/dev/null 2>&1; then
              cd $CMS_DIR && npm ci --omit=dev
              if command -v pm2 >/dev/null 2>&1; then
                pm2 delete archive-cms 2>/dev/null || true
                SITE_ROOT=$SITE_DIR SSH_PORT=${{ secrets.SERVER_PORT }} PORT=3000 \
                  pm2 start server.js --name archive-cms --cwd $CMS_DIR
                pm2 save
              else
                echo "::warning::pm2 가 없어 CMS를 재시작하지 못했습니다."
              fi
            else
              echo "::warning::서버에 Node가 없어 CMS를 설치하지 못했습니다. 정적 페이지만 배포됨."
            fi

            # nginx 설정은 덮어쓰지 않고 문법만 확인 (HTTPS/Certbot 설정 보호)
            echo "$PW" | sudo -S nginx -t
