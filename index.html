<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서원대학교 미디어콘텐츠학부 졸업전시 아카이브</title>
    <link rel="icon" type="image/png" href="assets/ui/favicon.png">
    <link rel="apple-touch-icon" href="assets/ui/favicon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --accent: #3b82f6;
            --muted: #64748b;
            --line: #e2e8f0;
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 5rem 2rem;
            box-sizing: border-box;
            flex: 1;
        }

        .header {
            margin-bottom: 5rem;
            animation: fadeInDown 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .header-inner {
            display: grid;
            grid-template-columns: 1fr 220px;
            align-items: start;
            gap: 40px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-stats {
            border-top: 1px solid var(--text-color);
            margin: 0;
        }

        .header-stats div {
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 7px 0;
        }

        .header-stats dt,
        .header-stats dd {
            font-family: var(--mono);
            font-size: 11px;
            margin: 0;
        }

        .header-stats dt { color: var(--muted); }
        .header-stats dd { font-weight: 600; }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 6px 0;
            letter-spacing: -0.03em;
        }

        .header p {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            margin: 0;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2.5rem;
        }

        .card {
            position: relative;
            border-radius: 12px;
            /* 코너 둥글기 살짝 줄임 (포스터 모서리 잘림 방지) */
            overflow: hidden;
            /* aspect-ratio: 1 / 1.414; 제거하여 이미지 원본 비율에 맞게 늘어나도록 변경 */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background-color: #222;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .card-thumbnail-img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-thumbnail-fallback {
            width: 100%;
            box-sizing: border-box;
            aspect-ratio: 1 / 1.414;
            flex: 1;
            /* 그리드 높이가 늘어날 때 빈 공간을 꽉 채우도록 설정 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            padding: 1.5rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .fallback-year {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            opacity: 0.85;
        }

        .fallback-title {
            font-size: clamp(1.6rem, 3vw, 2.4rem);
            font-weight: 800;
            line-height: 1.2;
            word-break: keep-all;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .card:hover .card-thumbnail-img,
        .card:hover .card-thumbnail-fallback {
            transform: scale(1.05);
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .card-main-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-year {
            font-size: 1.1rem;
            font-weight: 600;
            color: #93c5fd;
            margin-bottom: 0.5rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s 0.1s ease;
        }

        .card-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            letter-spacing: -0.02em;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s 0.2s ease;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-top: 1rem;
            margin-bottom: 0;
            font-weight: 300;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s 0.3s ease;
        }

        .card:hover .card-year,
        .card:hover .card-title,
        .card:hover .card-desc {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.2rem;
            background-color: var(--accent);
            color: white;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s 0.4s ease, background-color 0.2s;
        }

        .card:hover .btn-download {
            transform: translateY(0);
            opacity: 1;
        }

        .btn-download:hover {
            background-color: #2563eb;
            transform: scale(1.05) !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .footer {
            width: 100%;
            min-height: 204px;
            margin-top: 114px;
            padding: 42px 0 24px;
            box-sizing: border-box;
            background: #111111;
            color: #EDEDED;
        }

        .footer *, .footer *::before, .footer *::after { box-sizing: border-box; }

        .footer-inner {
            width: calc(100% - 40px);
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 30px;
        }

        .footer p {
            margin: 0 0 5px;
            font-size: 13px;
            font-weight: 400;
            line-height: 1.58;
            color: #EDEDED;
        }

        .footer-left { text-align: left; }
        .footer-copyright { margin-top: 9px !important; }
        .footer-right { margin-left: auto; text-align: right; }

        .footer-sns {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 9px;
            margin-top: 11px;
        }

        .footer-sns a { display: block; width: 32px; height: 32px; }
        .footer-sns img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .footer-sns a:hover { opacity: 0.65; }

        @media (max-width: 768px) {
            .footer { margin-top: 85px; min-height: auto; padding: 30px 0 35px; }
            .footer-inner {
                width: calc(100% - 48px);
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 68%);
                column-gap: 12px;
                row-gap: 14px;
                align-items: start;
            }
            .footer-left, .footer-right { display: contents; }
            .footer-inner p { margin: 0 !important; font-size: 12px; line-height: 1.5; }
            .footer-right > p:nth-of-type(1) { grid-column: 2; grid-row: 1; text-align: right; }
            .footer-right > p:nth-of-type(2) { grid-column: 2; grid-row: 2; text-align: right; }
            .footer-right > p:nth-of-type(3) { grid-column: 2; grid-row: 3; text-align: right; }
            .footer-left > p:nth-of-type(1) { grid-column: 2; grid-row: 4; margin-top: 15px !important; text-align: right; }
            .footer-left > p:nth-of-type(2) { grid-column: 2; grid-row: 5; text-align: right; }
            .footer-sns { grid-column: 1; grid-row: 4 / span 2; justify-content: flex-start; align-self: center; gap: 12px; margin: 0; }
            .footer-sns a { width: 34px; height: 34px; flex-shrink: 0; }
            .footer-copyright { grid-column: 1 / -1; grid-row: 6; margin-top: 30px !important; text-align: left; font-size: 11px !important; }
        }

        @media (max-width: 480px) {
            .footer-inner { grid-template-columns: minmax(0, 1fr) minmax(0, 75%); column-gap: 8px; }
            .footer-inner p { font-size: 10px; }
            .footer-sns a { width: 27px; height: 27px; }
            .footer-sns { gap: 7px; }
            .footer-copyright { font-size: 10px !important; }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header-inner {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .header-stats {
                margin-left: 62px;
            }

            .brand {
                gap: 14px;
            }

            .brand-logo {
                width: 48px;
                height: 48px;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .header p {
                font-size: 0.65rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .card-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-inner">
                <div class="brand">
                    <img class="brand-logo" src="assets/swmc-logo.png" alt="서원대학교 미디어콘텐츠학부 로고">
                    <div class="brand-text">
                        <h1>서원대학교 미디어콘텐츠학부 졸업전시 아카이브</h1>
                        <p>SWMC Graduation Exhibition Archive</p>
                    </div>
                </div>

                <dl class="header-stats" id="header-stats"></dl>
            </div>
        </header>

        <!-- 자바스크립트로 카드가 렌더링될 영역 -->
        <div class="grid" id="archive-grid"></div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-left">
                <p>서원대학교</p>
                <p>미디어콘텐츠학부</p>
                <p class="footer-copyright" id="footer-copyright">© 2026 서원대학교 미디어콘텐츠학부. All rights reserved.</p>
            </div>
            <div class="footer-right">
                <p>충청북도 청주시 서원구 무심서로 377-3</p>
                <p>043-299-8800</p>
                <p>media@seowon.ac.kr</p>
                <div class="footer-sns">
                    <a href="https://www.instagram.com/swu_mediacontents/" aria-label="Instagram" target="_blank" rel="noopener noreferrer"><img src="assets/ui/footer-instagram.png" alt=""></a>
                    <a href="https://www.youtube.com/@%EB%AF%B8%EB%94%94%EC%96%B4%EC%BD%98%ED%85%90%EC%B8%A0%ED%95%99%EB%B6%80" aria-label="YouTube" target="_blank" rel="noopener noreferrer"><img src="assets/ui/footer-youtube.png" alt=""></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- 분리된 데이터 파일 로드 -->
    <!-- CMS에서 수정한 내용이 바로 보이도록 data.js는 캐시를 피해 불러옵니다 -->
    <script>document.write('<script src="data.js?t=' + Date.now() + '"><\/script>');</script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const years = archives.map((item) => Number(item.year));
            const minYear = Math.min(...years);
            const maxYear = Math.max(...years);
            const yearRange = minYear === maxYear ? `${minYear}` : `${minYear}—${maxYear}`;
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const thisYear = now.getFullYear();

            const formatPeriod = (start, end) => {
                if (!start) return '';
                const s = start.replace(/-/g, '.');
                if (!end || end === start) return s;
                return `${s} – ${end.slice(0, 4) === start.slice(0, 4) ? end.slice(5).replace('-', '.') : end.replace(/-/g, '.')}`;
            };

            // 올해 전시가 있으면 그것을, 없으면 올해 이전 중 가장 최근 전시를 보여줍니다.
            const current = archives.find((item) => Number(item.year) === thisYear);
            const latest = current
                || archives.filter((item) => Number(item.year) < thisYear).sort((a, b) => b.year - a.year)[0]
                || archives.find((item) => Number(item.year) === maxYear);

            // 아직 끝나지 않은 가장 가까운 전시 기간이 있으면 자동으로 NEXT에 표시합니다.
            const upcoming = archives
                .filter((item) => item.startDate && (item.endDate || item.startDate) >= today)
                .sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
            const nextText = upcoming
                ? formatPeriod(upcoming.startDate, upcoming.endDate)
                : String(departmentInfo.nextExhibitionDate).replace(/-/g, '.');

            document.getElementById('header-stats').innerHTML = `
                <div><dt>EXHIBITIONS</dt><dd>${archives.length}</dd></div>
                <div><dt>${current ? 'THIS YEAR' : 'LATEST'}</dt><dd>${latest.year} · ${latest.title}</dd></div>
                <div><dt>NEXT</dt><dd>${nextText}</dd></div>
            `;

            const grid = document.getElementById('archive-grid');


            archives.forEach((item, index) => {
                const article = document.createElement('article');
                article.className = 'card';
                article.style.animationDelay = `${(index + 1) * 0.1}s`;

                // 포스터 이미지가 있으면 실제 원본 비율대로 그려지는 img 태그 사용
                // 없으면 기존처럼 그라데이션 빈 공간(fallback) 사용
                const thumbnailHTML = item.poster
                    ? `<img src="${item.poster}" class="card-thumbnail-img" alt="${item.title} 포스터">`
                    : `<div class="card-thumbnail-fallback" style="background: ${item.placeholderGradient};"><span class="fallback-year">${item.year}</span><span class="fallback-title">${item.title}</span></div>`;

                article.innerHTML = `
                    ${thumbnailHTML}
                    <div class="card-overlay">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="card-main-link">
                            <span class="card-year">${item.year}</span>
                            <h2 class="card-title">${item.title}</h2>
                            <p class="card-desc">${item.desc}</p>
                            ${item.startDate ? `<p class="card-desc">${formatPeriod(item.startDate, item.endDate)}</p>` : ''}
                        </a>
                        ${item.catalog ? `<a href="${item.catalog}" class="btn-download" target="_blank" rel="noopener noreferrer">
                            도록 보기
                        </a>` : ''}
                    </div>
                `;

                grid.appendChild(article);

                // 서버에 도록 파일이 실제로 없으면(404 등) 버튼을 숨김
                if (item.catalog) {
                    fetch(item.catalog, { method: 'HEAD' })
                        .then(res => { if (!res.ok) throw new Error('missing'); })
                        .catch(() => article.querySelector('.btn-download')?.remove());
                }
            });

            document.getElementById('footer-copyright').textContent = `© ${yearRange} 서원대학교 미디어콘텐츠학부. All rights reserved.`;
        });
    </script>
</body>

</html>
