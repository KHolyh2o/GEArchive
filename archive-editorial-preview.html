<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>졸업전시 아카이브 — 에디토리얼 레이아웃 미리보기</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --archive-blue: #082baa;
            --ink: #151512;
            --muted: #747169;
            --soft: #aaa69d;
            --line: #d8d5cc;
            --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: #fff;
            color: var(--ink);
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.55;
        }

        a { color: inherit; text-decoration: none; }
        a:focus-visible { outline: 2px solid var(--archive-blue); outline-offset: 3px; }

        .archive-experience {
            background: #fff;
            min-height: 100vh;
        }

        .archive-shell {
            background: #fff;
            margin: 0 auto;
            max-width: 820px;
            min-height: 100vh;
            padding: 56px 32px 40px;
        }

        .archive-intro {
            align-items: start;
            display: grid;
            gap: 40px;
            grid-template-columns: 1fr 225px;
            margin-bottom: 92px;
        }

        .archive-brand {
            align-items: center;
            display: grid;
            gap: 16px;
            grid-template-columns: 54px 1fr;
        }

        .archive-logo {
            height: 54px;
            width: 54px;
            flex-shrink: 0;
        }

        .archive-logo img {
            display: block;
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .archive-intro h1 {
            font-size: 17px;
            font-weight: 650;
            letter-spacing: -.035em;
            line-height: 1.35;
            margin: 0 0 5px;
        }

        .archive-intro p {
            color: var(--muted);
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: -.02em;
            margin: 0;
        }

        .archive-summary { border-top: 1px solid var(--ink); margin: 0; }
        .archive-summary div {
            border-bottom: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 6px 0;
        }

        .archive-summary dt,
        .archive-summary dd {
            font-family: var(--mono);
            font-size: 9px;
            margin: 0;
        }

        .archive-summary dt { color: var(--muted); }

        .archive-section { margin: 0 0 70px; }
        .archive-section h2 {
            font-size: 14px;
            font-weight: 650;
            letter-spacing: -.025em;
            margin: 0 0 18px;
        }

        .archive-section h2 span {
            color: var(--muted);
            font-size: 11px;
            font-weight: 400;
            margin-left: 5px;
        }

        .section-title-row { align-items: center; display: flex; justify-content: space-between; }
        .section-title-row > p {
            align-items: center;
            color: var(--muted);
            display: flex;
            font-family: var(--mono);
            font-size: 8px;
            gap: 5px;
            margin: 0 0 18px;
        }

        .section-title-row i,
        .section-title-row b {
            border-radius: 50%;
            display: inline-block;
            height: 5px;
            width: 5px;
        }

        .section-title-row i { background: var(--archive-blue); }
        .section-title-row b { border: 1px solid var(--soft); margin-left: 7px; }

        .archive-column-head {
            border-top: 1px solid var(--ink);
            color: var(--muted);
            display: grid;
            font-family: var(--mono);
            font-size: 8px;
            grid-template-columns: 74px 1fr 58px;
            padding: 8px 0 6px;
        }

        .archive-column-head span:last-child { text-align: right; }

        .archive-entry {
            border-bottom: 1px solid var(--line);
            padding: 0 0 10px;
            transition: background 160ms ease;
        }

        .archive-entry:hover { background: rgba(21, 21, 18, .018); }

        .entry-title {
            align-items: start;
            display: grid;
            grid-template-columns: 74px 1fr 58px;
            padding: 11px 0 0;
        }

        .entry-year {
            font-family: var(--mono);
            font-size: 11px;
        }

        .entry-year small {
            color: var(--soft);
            display: block;
            font-size: 8px;
            margin-top: 1px;
        }

        .entry-main strong {
            display: block;
            font-size: 15px;
            font-weight: 520;
            letter-spacing: -.035em;
            line-height: 1.25;
        }

        .entry-main small {
            color: var(--muted);
            display: block;
            font-size: 10px;
            letter-spacing: -.02em;
            margin-top: 3px;
        }

        .entry-status {
            color: var(--soft);
            font-family: var(--mono);
            font-size: 8px;
            padding-top: 3px;
            text-align: right;
        }

        .is-current .entry-year,
        .is-current .entry-status { color: var(--archive-blue); }

        .entry-links {
            align-items: center;
            display: flex;
            font-size: 10px;
            gap: 8px;
            margin: 7px 0 0 74px;
        }

        .entry-links > span { color: var(--line); }
        .entry-links a:hover,
        .entry-links a:focus-visible { text-decoration: underline; text-underline-offset: 3px; }

        .archive-notice {
            color: var(--muted);
            font-size: 10px;
            line-height: 1.7;
            margin: 13px 0 0;
            max-width: 620px;
        }

        .archive-notice strong {
            color: var(--ink);
            font-family: var(--mono);
            font-size: 9px;
        }

        .archive-footer {
            border-top: 1px solid var(--ink);
            color: var(--muted);
            display: flex;
            font-family: var(--mono);
            font-size: 8px;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 11px;
        }

        .archive-footer p { margin: 0; }

        .preview-banner {
            background: #151512;
            color: #fff;
            font-family: var(--mono);
            font-size: 11px;
            padding: 8px 16px;
            text-align: center;
            letter-spacing: -.01em;
        }

        @media (max-width: 860px) {
            .archive-shell { box-shadow: none; }
        }

        @media (max-width: 700px) {
            .archive-shell { padding: 32px 20px; }
            .archive-intro { display: block; margin-bottom: 66px; }
            .archive-brand { align-items: start; }
            .archive-summary { margin: 38px 0 0 70px; }
            .archive-section { margin-bottom: 56px; }
            .archive-column-head { grid-template-columns: 54px 1fr 50px; }
            .entry-title { grid-template-columns: 54px 1fr 50px; }
            .entry-main strong { font-size: 14px; }
            .entry-main small { font-size: 9px; }
            .entry-links { margin-left: 54px; }
            .archive-footer { display: block; }
            .archive-footer p + p { margin-top: 3px; }
        }

        @media (max-width: 440px) {
            .archive-brand { grid-template-columns: 48px 1fr; gap: 13px; }
            .archive-logo { height: 48px; width: 48px; }
            .archive-intro h1 { font-size: 15px; }
            .archive-summary { margin-left: 61px; }
            .entry-links { align-items: flex-start; flex-direction: column; gap: 3px; }
            .entry-links > span { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .archive-entry { transition: none; }
        }
    </style>
</head>

<body>
    <p class="preview-banner">PREVIEW — index.html은 그대로입니다. 마음에 들면 알려주세요, 그때 실제 페이지에 반영할게요.</p>

    <div class="archive-experience">
        <main class="archive-shell">
            <header class="archive-intro">
                <div class="archive-brand">
                    <div class="archive-logo">
                        <img src="assets/swmc-logo.png" alt="서원대학교 미디어콘텐츠학부 로고">
                    </div>
                    <div>
                        <h1>서원대학교 미디어콘텐츠학부 졸업전시 아카이브</h1>
                        <p>SWMC GRADUATION EXHIBITION ARCHIVE</p>
                    </div>
                </div>

                <dl class="archive-summary" id="archive-summary"></dl>
            </header>

            <section class="archive-section" aria-labelledby="archive-heading">
                <div class="section-title-row">
                    <h2 id="archive-heading">졸업전시 <span>Archive</span></h2>
                    <p><i></i> CURRENT <b></b> ARCHIVE</p>
                </div>

                <div class="archive-column-head" aria-hidden="true">
                    <span>YEAR / ISSUE</span>
                    <span>EXHIBITION</span>
                    <span>STATUS</span>
                </div>

                <div class="archive-list" id="archive-list"></div>
            </section>

            <footer class="archive-footer" id="archive-footer"></footer>
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sorted = [...archives].sort((a, b) => Number(a.year) - Number(b.year));
            const issueByYear = new Map(sorted.map((item, i) => [item.year, String(i + 1).padStart(3, '0')]));
            const mostRecentYear = sorted[sorted.length - 1].year;
            const minYear = sorted[0].year;
            const maxYear = sorted[sorted.length - 1].year;

            const latest = sorted[sorted.length - 1];
            const summary = document.getElementById('archive-summary');
            summary.innerHTML = `
                <div><dt>EXHIBITIONS</dt><dd>${archives.length}</dd></div>
                <div><dt>LATEST</dt><dd>${latest.year} · ${latest.title}</dd></div>
                <div><dt>NEXT</dt><dd>${departmentInfo.nextExhibitionDate}</dd></div>
            `;

            const list = document.getElementById('archive-list');
            archives.forEach((item) => {
                const isCurrent = item.year === mostRecentYear;
                const article = document.createElement('article');
                article.className = `archive-entry ${isCurrent ? 'is-current' : ''}`;

                const linksHTML = [
                    item.link ? `<a href="${item.link}" target="_blank" rel="noreferrer">졸전 사이트 바로가기 <span aria-hidden="true">↗</span></a>` : '',
                    item.catalog ? `<a href="${item.catalog}" target="_blank" rel="noreferrer">도록 보기 <span aria-hidden="true">↗</span></a>` : '',
                ].filter(Boolean).join('<span aria-hidden="true">/</span>');

                article.innerHTML = `
                    <div class="entry-title">
                        <div class="entry-year">${item.year}<small>ISSUE ${issueByYear.get(item.year)}</small></div>
                        <div class="entry-main">
                            <strong>${item.title}</strong>
                            <small>${item.desc}</small>
                        </div>
                        <span class="entry-status">${isCurrent ? 'CURRENT' : 'ARCHIVE'}</span>
                    </div>
                    <div class="entry-links">${linksHTML}</div>
                `;

                list.appendChild(article);
            });

            document.getElementById('archive-footer').innerHTML = `
                <p>© ${minYear}—${maxYear} School of Media Contents, Seowon University.</p>
                <p>Cheongju, Republic of Korea.</p>
            `;
        });
    </script>
</body>

</html>
